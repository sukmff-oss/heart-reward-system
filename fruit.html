<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Fruit Slot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{font-family:system-ui,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;background:linear-gradient(135deg,#0a0118,#1a0a2e,#0d1a3a);z-index:0}
.stars{position:fixed;inset:0;z-index:1;pointer-events:none}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 2s infinite}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes lampBlink{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ledMove{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes winGlow{0%,100%{box-shadow:inset 0 0 10px #FFD700,0 0 5px #FFD700;transform:scale(1)}50%{box-shadow:inset 0 0 40px #FFD700,0 0 30px #FF8C00;transform:scale(1.08)}}
@keyframes confettiFall{0%{transform:translateY(-10vh) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes moneyBurst{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg);opacity:0}50%{transform:translate(-50%,-50%) scale(1.4) rotate(10deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(0deg);opacity:0}}
@keyframes drawLine{0%{stroke-dashoffset:300;opacity:0}20%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;padding:6px 12px;background:linear-gradient(180deg,#FFD700,#FF8C00);display:flex;justify-content:space-between;align-items:center;border-radius:0 0 12px 12px;box-shadow:0 2px 10px rgba(255,140,0,.4)}
.hdr-l{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hdr-l .icon{font-size:16px}
.hdr-l .title{font-size:13px;font-weight:900;color:#1a1a2e}
.hdr-r{display:flex;align-items:center;gap:6px}
.pearl-box{background:rgba(0,0,0,.15);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700;color:#1a1a2e}
.bet-box{background:rgba(0,0,0,.15);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700;color:#1a1a2e}
.bet-label{font-size:9px;opacity:.7}
.bet-val{font-size:12px;font-weight:900}
.back-btn,.recharge-btn{background:rgba(0,0,0,.2);border:none;border-radius:6px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer;color:#1a1a2e}
.main{padding:48px 8px 12px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:2;gap:10px}
.jp-banner{background:linear-gradient(135deg,#1a0a2e,#2d1b4e);border:2px solid #FFD700;border-radius:14px;padding:10px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;max-width:340px;transition:transform .2s}
.jp-banner:hover{transform:scale(1.02)}
.jp-label{font-size:13px;color:#FFD700;font-weight:700}
.jp-amount{font-size:20px;font-weight:900;color:#FFD700;text-shadow:0 0 10px rgba(255,215,0,.5)}
.jp-hint{font-size:11px;color:rgba(255,255,255,.5);margin-left:auto}
.slot-machine{width:100%;max-width:290px}
.machine-frame{background:linear-gradient(145deg,#1a1a3e,#2d1b4e);border:3px solid #FFD700;border-radius:14px;padding:10px 8px;position:relative;box-shadow:0 0 25px rgba(255,215,0,.2),inset 0 0 15px rgba(255,215,0,.05)}
.frame-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.corner{width:12px;height:12px;border:2px solid #FFD700;border-radius:50%}
.corner.left{background:#FF6600;box-shadow:0 0 6px #FF6600;animation:lampBlink 1s infinite}
.corner.right{background:#FFD700;box-shadow:0 0 6px #FFD700;animation:lampBlink 1s infinite;animation-delay:.5s}
.led-strip{height:3px;flex:1;margin:0 6px;border-radius:2px;background:linear-gradient(90deg,#FF0000,#FFFF00,#00FF00,#00FFFF,#0000FF,#FF00FF,#FF0000);background-size:200% 100%;animation:ledMove 2s linear infinite}
.frame-bottom{display:flex;align-items:center;gap:6px}
.side-panel{flex:1}
.lamp-box{display:flex;flex-direction:column;gap:2px}
.lamp{width:10px;height:10px;border-radius:50%;background:#333;transition:all .3s}
.lamp.on{background:#FF6600;box-shadow:0 0 6px #FF6600,0 0 12px #FF6600}
.grid-area{position:relative;margin-bottom:8px}
.grid-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;overflow:visible}
.grid-svg .wl{stroke:#FFD700;stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:300;animation:drawLine .4s ease-out forwards}
.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.cell-wrapper{background:#fff;height:64px;border-radius:6px;overflow:hidden;position:relative;box-shadow:inset 0 10px 8px rgba(0,0,0,0.85),inset 0 -10px 8px rgba(0,0,0,0.85);border:2px solid #333}
.cell{height:100%;width:100%;display:flex;justify-content:center;align-items:center;font-size:30px;color:#000;transform:translateY(0)}
.cell.seven{font-size:28px;font-weight:900;background:linear-gradient(180deg,#FFD700,#FF8C00,#CC6600,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 0 #996600) drop-shadow(0 2px 0 #774400) drop-shadow(0 3px 0 #553300) drop-shadow(0 4px 0 #332200);text-shadow:none}
        .spinning {
            animation: verticalScroll3D 0.15s infinite linear;
        }

        @keyframes verticalScroll3D {
            0% {
                transform: translateY(-35px) scaleY(0.7);
                filter: blur(1px) brightness(0.7);
            }
            50% {
                transform: translateY(0) scaleY(1.1);
                filter: blur(0px) brightness(1.2);
            }
            100% {
                transform: translateY(35px) scaleY(0.7);
                filter: blur(1px) brightness(0.7);
            }
        }

        .win-glow{
            animation: redFlash 0.3s infinite alternate !important;
            border: 4px solid #ff0000 !important;
            background: #ffcccc !important;
            box-shadow: 0 0 20px rgba(255,0,0,.9), 0 0 40px rgba(255,0,0,.6), 0 0 60px rgba(255,0,0,.3) !important;
            transform: scale(1.1) !important;
            z-index: 10;
        }
        @keyframes redFlash {
            from { border-color: #ff0000; box-shadow: 0 0 20px rgba(255,0,0,.9), 0 0 40px rgba(255,0,0,.6); }
            to { border-color: #ff6666; box-shadow: 0 0 35px rgba(255,0,0,1), 0 0 70px rgba(255,0,0,.8), 0 0 100px rgba(255,0,0,.4); }
        }
.auto-btn{
            padding:8px 20px;border:2px solid #555;border-radius:20px;
            background:linear-gradient(180deg,#333,#222);color:#FFD700;
            font-size:13px;font-weight:bold;cursor:pointer;margin-bottom:10px;
            transition:all .2s;display:block;width:100%;max-width:340px;
        .spin-btn{
                    flex:2;padding:10px 0;border:none;border-radius:20px;
                    background:linear-gradient(180deg,#ff4500,#cc3700);
                    color:#fff;font-size:15px;font-weight:bold;cursor:pointer;
                    box-shadow:0 3px #992900,0 4px 6px rgba(0,0,0,.4);
                    transition:.1s;width:90%;margin:4px auto;display:block;
                }
                .spin-btn:active{box-shadow:0 1px #992900,0 2px 3px rgba(0,0,0,.3);transform:translateY(2px)}
                .spin-btn:disabled{background:#444;color:#888;box-shadow:none;cursor:not-allowed;transform:none}
        .nudge-btn{background:linear-gradient(180deg,#444,#222);border:2px solid #555;border-radius:8px;padding:6px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:all .2s}
        .nudge-btn:hover{background:linear-gradient(180deg,#555,#333);border-color:#FFD700}
        .nudge-btn span:first-child{font-size:14px}
        .nudge-label{font-size:7px;color:rgba(255,255,255,.5);letter-spacing:1px}
        .nudge-btn.disabled{opacity:.4;cursor:not-allowed}
        .result-box{margin-top:6px;text-align:center;font-size:13px;font-weight:700;min-height:22px;padding:5px 12px;border-radius:8px;width:100%;max-width:290px}
        .bet-panel{width:100%;max-width:290px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px}
        .bet-title{text-align:center;font-size:10px;color:rgba(255,255,255,.5);margin-bottom:8px;font-weight:700;letter-spacing:2px}
        .bet-options{display:flex;gap:6px}
        .bet-opt{flex:1;padding:8px 4px;border:2px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(255,255,255,.05);color:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;text-align:center}
        .bet-opt:hover{border-color:#FFD700;background:rgba(255,215,0,.1)}
        .bet-opt.active{background:linear-gradient(180deg,#FFD700,#FF8C00);color:#1a1a2e;border-color:#FFD700;box-shadow:0 0 10px rgba(255,215,0,.4)}
        .info-row{display:flex;gap:8px;width:100%;max-width:290px}
        .stat-box{flex:1;background:rgba(255,255,255,.05);border-radius:10px;padding:8px;text-align:center}
        .stat-label{display:block;font-size:10px;color:rgba(255,255,255,.5);margin-bottom:3px}
        .stat-val{font-size:14px;font-weight:900;color:#FFD700}
        .paytable-btn{background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);border-radius:10px;padding:8px 20px;color:#FFD700;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s}
        .paytable-btn:hover{background:rgba(255,215,0,.2)}
        .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
        .modal.show{display:flex}
        .modal-cnt{background:linear-gradient(145deg,#1a1a3e,#2d1b4e);border:2px solid #FFD700;border-radius:16px;padding:18px;width:90%;max-width:300px;text-align:center;animation:scaleIn .2s ease-out}
        @keyframes scaleIn{0%{transform:scale(0.8);opacity:0}100%{transform:scale(1);opacity:1}}
        .modal-cnt h3{color:#FFD700;font-size:16px;margin-bottom:12px}
        .bal-row{display:flex;justify-content:space-between;margin-bottom:10px;font-size:12px;color:rgba(255,255,255,.7);padding:6px 10px;background:rgba(0,0,0,.2);border-radius:6px}
        .bal-row span:last-child{color:#FFD700;font-weight:700}
        .r-opt{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.08);border-radius:10px;padding:10px 14px;margin-bottom:6px;cursor:pointer;border:2px solid transparent;transition:all .2s}
        .r-opt:hover:not(.disabled){border-color:#FFD700;transform:translateX(4px)}
        .r-opt .r-left{color:#fff;font-size:13px;font-weight:700}
        .r-opt .r-right{color:#FFD700;font-size:12px;font-weight:900}
        .r-opt.disabled{opacity:.4;cursor:not-allowed}
        .close-btn{margin-top:10px;width:100%;padding:8px;border:none;border-radius:8px;background:#555;color:#fff;font-size:13px;cursor:pointer}
        .auto-btn{padding:6px 16px;border:2px solid #555;border-radius:16px;background:linear-gradient(180deg,#333,#222);color:#FFD700;font-size:12px;font-weight:bold;cursor:pointer;margin-bottom:8px;transition:all .2s;display:block;width:100%;max-width:290px}
        .auto-btn:hover{border-color:#FFD700;background:linear-gradient(180deg,#444,#333)}
.win-particles{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden}
.particle{position:absolute;border-radius:50%;animation:confettiFall 1.5s ease-out forwards}
.money-pop{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:36px;font-weight:900;color:#FFD700;text-shadow:0 0 20px rgba(255,215,0,.8);animation:moneyBurst .8s ease-out forwards;z-index:160;pointer-events:none}
.pt-table{width:100%;border-collapse:collapse}
.pt-table th{color:#FFD700;font-size:12px;padding:8px;text-align:center;border-bottom:1px solid rgba(255,215,0,.2)}
.pt-table td{padding:8px;text-align:center;font-size:14px;color:#fff}
.pt-table tr:nth-child(even){background:rgba(255,255,255,.05)}
.pt-sym{font-size:20px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="stars" id="stars"></div>
<div class="hdr">
  <div class="hdr-l"><span class="icon">🍉</span><span class="title">皇家水果盤</span><span class="pearl-box">💎 <span id="pearlVal">0</span> P</span></div>
  <div class="hdr-r">
    <div class="bet-box"><span class="bet-label">BET</span><span class="bet-val" id="betVal">100</span></div>
    <button class="recharge-btn" onclick="openRecharge()">💰</button>
    <button class="back-btn" onclick="location.href='index.html'">←</button>
  </div>
</div>
<div class="main">
  <div class="jp-banner" onclick="showJackpot()">
    <span class="jp-label">🎰 彩金池</span>
    <span class="jp-amount" id="jpAmount">$0</span>
    <span class="jp-hint">💡</span>
  </div>
  <div class="slot-machine">
    <div class="machine-frame">
      <div class="frame-top">
        <div class="corner left"></div>
        <div class="led-strip"></div>
        <div class="corner right"></div>
      </div>
      <div class="grid-area">
        <svg class="grid-svg" id="gridSvg" viewBox="0 0 320 320"></svg>
        <div class="slot-grid" id="slotGrid">
          <div class="cell-wrapper"><div class="cell" id="c0">🍒</div></div>
          <div class="cell-wrapper"><div class="cell" id="c1">🍊</div></div>
          <div class="cell-wrapper"><div class="cell" id="c2">🍇</div></div>
          <div class="cell-wrapper"><div class="cell" id="c3">🍉</div></div>
          <div class="cell-wrapper"><div class="cell" id="c4">🔔</div></div>
          <div class="cell-wrapper"><div class="cell" id="c5">⭐</div></div>
          <div class="cell-wrapper"><div class="cell" id="c6">⑦</div></div>
          <div class="cell-wrapper"><div class="cell" id="c7">💎</div></div>
          <div class="cell-wrapper"><div class="cell" id="c8">🍒</div></div>
        </div>
      </div>

      <div class="frame-bottom">
        <div class="side-panel left">
          <div class="lamp-box">
            <div class="lamp" id="lamp1"></div>
            <div class="lamp" id="lamp2"></div>
            <div class="lamp" id="lamp3"></div>
          </div>
        </div>
        <button class="spin-btn" id="spinBtn" onclick="startSpin()">
          <span class="btn-icon">🎰</span>
          <span class="btn-text">SPIN</span>
          <span class="btn-cost" id="btnCost">100P</span>
        </button>
        <div class="side-panel right">
          <div class="nudge-btn" id="nudgeBtn" onclick="doNudge()">
            <span>&#x2B06;</span>
            <span class="nudge-label">NUDGE</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="result-box" id="resultBox"></div>
  <button class="auto-btn" id="autoBtn" onclick="toggleAuto()">🔄 自動</button>
  <div class="bet-panel">
    <div class="bet-title">BET LEVEL</div>
    <div class="bet-options" id="betOptions">
      <button class="bet-opt active" onclick="setBet(100)">100</button>
      <button class="bet-opt" onclick="setBet(200)">200</button>
      <button class="bet-opt" onclick="setBet(500)">500</button>
      <button class="bet-opt" onclick="setBet(1000)">MAX</button>
    </div>
  </div>
  <div class="info-row">
    <div class="stat-box"><span class="stat-label">💰 美元</span><span class="stat-val" id="usdVal">0</span></div>
    <div class="stat-box"><span class="stat-label">🎲 勝率</span><span class="stat-val">25%</span></div>
    <div class="stat-box"><span class="stat-label">🏆 最高</span><span class="stat-val" id="maxWin">0</span></div>
  </div>
  <div class="paytable-btn" onclick="showPaytable()">📋 赔率表</div>
</div>

<div class="modal" id="rechargeModal">
  <div class="modal-cnt">
    <h3>💰 珍珠幣充值</h3>
    <div class="bal-row"><span>💰 美元餘額</span><span id="modalUsd">0</span></div>
    <div class="bal-row"><span>💎 珍珠幣</span><span id="modalPearl">0 P</span></div>
    <div class="r-opt" onclick="doRecharge(100)"><span class="r-left">$100</span><span class="r-right">10,000 P</span></div>
    <div class="r-opt" onclick="doRecharge(200)"><span class="r-left">$200</span><span class="r-right">20,000 P</span></div>
    <div class="r-opt" onclick="doRecharge(500)"><span class="r-left">$500</span><span class="r-right">50,000 P</span></div>
    <div class="r-opt" onclick="doRecharge(1000)"><span class="r-left">$1,000</span><span class="r-right">100,000 P</span></div>
    <button class="close-btn" onclick="closeRecharge()">關閉</button>
  </div>
</div>
<div class="modal" id="paytableModal">
  <div class="modal-cnt">
    <h3>🎰 赔率表</h3>
    <table class="pt-table"><thead><tr><th>&#x7B26;&#x865F;</th><th>x3</th></tr></thead><tbody>
    <tr><td class="pt-sym">🍒</td><td>3</td></tr>
    <tr><td class="pt-sym">🍊</td><td>5</td></tr>
    <tr><td class="pt-sym">🍇</td><td>8</td></tr>
    <tr><td class="pt-sym">🍉</td><td>15</td></tr>
    <tr><td class="pt-sym">🔔</td><td>25</td></tr>
    <tr><td class="pt-sym">⭐</td><td>50</td></tr>
    <tr><td class="pt-sym">⑦</td><td>100</td></tr>
    <tr><td class="pt-sym">💎</td><td>250</td></tr>
    </tbody></table>
    <button class="close-btn" onclick="closePaytable()">關閉</button>
  </div>
</div>
<script>
const SYMS=['🍒','🍊','🍇','🍉','🔔','⭐','⑦','💎'];
const WGTS=[28,23,18,12,8,5,2,0.5];
const MULT={};
SYMS.forEach((s,i)=>{MULT[s]=Math.pow(2,i+1)*1.5});
MULT[SYMS[0]]=3;MULT[SYMS[1]]=5;MULT[SYMS[2]]=8;MULT[SYMS[3]]=15;MULT[SYMS[4]]=25;MULT[SYMS[5]]=50;MULT[SYMS[6]]=100;MULT[SYMS[7]]=250;
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let currentBet=100;
let isSpinning=false;
let jpAmount=0;
let jpHistory=[];
let maxWin=0;
let nudgeCount=0;
let finalGrid=[];
let autoMode=false;
let autoInterval=null;

function toggleAuto(){
  autoMode=!autoMode;
  const btn=document.getElementById('autoBtn');
  if(autoMode){
    btn.textContent='⏸ 停止';btn.style.background='linear-gradient(180deg,#555,#333)';btn.style.borderColor='#FFD700';
    if(!isSpinning)startSpin();
  }else{
    btn.textContent='🔄 自動';btn.style.background='linear-gradient(180deg,#333,#222)';btn.style.borderColor='#555';
    if(autoInterval){clearInterval(autoInterval);autoInterval=null}
  }
}

function drawWinLines(lines){
  const svg=document.getElementById('gridSvg');
  if(!svg)return;
  svg.innerHTML='';
  const map=[[53,53],[160,53],[267,53],[53,160],[160,160],[267,160],[53,267],[160,267],[267,267]];
  const colors=['#FFD700','#FF6600','#00FFFF','#FF00FF','#FFFF00','#00FF00','#FF3366','#66FF33'];
  lines.forEach((line,i)=>{
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    const pts=line.map(idx=>map[idx]);
    let d='M'+pts[0][0]+','+pts[0][1];
    for(let j=1;j<pts.length;j++)d+='L'+pts[j][0]+','+pts[j][1];
    p.setAttribute('d',d);
    p.setAttribute('class','wl');
    p.style.stroke=colors[i%colors.length];
    p.style.strokeWidth='5';
    p.style.strokeDasharray='300';
    p.style.strokeDashoffset='300';
    p.style.filter='drop-shadow(0 0 6px '+colors[i%colors.length]+')';
    p.style.animation='drawLine .4s ease-out forwards';
    svg.appendChild(p);
  });
}
function clearWinLines(){
  const svg=document.getElementById('gridSvg');
  if(svg)svg.innerHTML='';
}

function gD(){return JSON.parse(localStorage.getItem('gyc_savings')||'{}')}
function sD(d){localStorage.setItem('gyc_savings',JSON.stringify(d))}
function gp(){const d=gD();return d.pearls||0}
function sp(v){const d=gD();d.pearls=v;sD(d);refresh()}
function refresh(){
  document.getElementById('pearlVal').textContent=gp().toLocaleString();
  const d=gD();document.getElementById('usdVal').textContent=(d.total||0).toLocaleString();
  document.getElementById('jpAmount').textContent='$'+jpAmount.toLocaleString();
  if(maxWin)document.getElementById('maxWin').textContent=maxWin.toLocaleString();
}
function rSym(){let r=Math.random()*WGTS.reduce((a,b)=>a+b,0);for(let i=0;i<WGTS.length;i++){r-=WGTS[i];if(r<=0)return SYMS[i]}return SYMS[0]}

function buildGrid(){
  for(let i=0;i<9;i++){
    const c=document.getElementById('c'+i);
    if(c){c.innerText=rSym();applySevenStyle(c)}
  }
}
function applySevenStyle(el){
  if(!el)return;
  if(el.innerText==='⑦'||el.innerText==='7\uFE0F\u20E3'||el.innerText.match(/^7$/)){
    el.classList.add('seven')
  }else{
    el.classList.remove('seven')
  }
}

function setBet(b){currentBet=b;document.getElementById('betVal').textContent=b;document.getElementById('btnCost').textContent=b+'P';document.querySelectorAll('.bet-opt').forEach(el=>{el.classList.toggle('active',el.textContent==(b==1000?'MAX':b+''))})}

function startSpin(){
  if(isSpinning)return;
  if(gp()<currentBet){alert('珍珠幣不足！');if(autoMode)toggleAuto();return}
  isSpinning=true;nudgeCount=0;sp(gp()-currentBet);
  document.getElementById('resultBox').textContent='';
  document.getElementById('resultBox').className='result-box';
  document.querySelectorAll('.win-glow').forEach(el=>el.classList.remove('win-glow'));
  clearWinLines();
  document.querySelectorAll('.lamp').forEach(el=>el.classList.remove('on'));
  let btn=document.getElementById('spinBtn');
  btn.disabled=true;
  document.getElementById('nudgeBtn').classList.add('disabled');

  const cells=[];
  for(let i=0;i<9;i++){
    const cell=document.getElementById('c'+i);
    if(cell){cell.className='cell';cells.push(cell)}
  }

  // Fast symbol shuffling during spin
  let ticks=0;
  const spinInt=setInterval(()=>{
    cells.forEach(c=>{if(c)c.innerText=SYMS[Math.floor(Math.random()*SYMS.length)]});
    playTick();
    ticks++;
    if(ticks>=12){clearInterval(spinInt);stopAndCheck()}
  },120);

  function stopAndCheck(){
    const finalGrid=[];
    cells.forEach((c,i)=>{
      if(c){c.classList.remove('spinning');finalGrid.push(c.innerText);applySevenStyle(c)}
    });

    const winLines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    let winCount=0;
    let winCells=new Set();
    winLines.forEach(line=>{
      const[a,b,c]=[finalGrid[line[0]],finalGrid[line[1]],finalGrid[line[2]]];
      if(a===b&&b===c){winCount++;line.forEach(idx=>winCells.add(idx))}
    });

    if(winCount>0){
      winCells.forEach(idx=>{
        const cell=document.getElementById('c'+idx);
        if(cell){const wrapper=cell.parentElement;if(wrapper)wrapper.classList.add('win-glow')}
      });
      let winAmt=winCount*currentBet*(MULT[finalGrid[Array.from(winCells)[0]]]||3);
      jpAmount+=Math.floor(winAmt*0.05);
      let newMax=Math.max(maxWin,winAmt);
      if(newMax>maxWin){maxWin=newMax;localStorage.setItem('fruit_max',maxWin)}
      const winningLines=winLines.filter(line=>finalGrid[line[0]]===finalGrid[line[1]]&&finalGrid[line[1]]===finalGrid[line[2]]);
      drawWinLines(winningLines);
      sp(gp()+winAmt);
      let rb=document.getElementById('resultBox');
      rb.className='result-box win';
      rb.textContent='🎉 連線成功！大贏 '+winAmt.toLocaleString()+' P！！';
      playWinSound();triggerParticles();triggerMoneyPop(winAmt);
      if(autoMode){
        if(autoInterval)clearInterval(autoInterval);
        autoInterval=setInterval(autoSpinCheck,10000);
      }
    }else{
      setTimeout(()=>{
        let rb=document.getElementById('resultBox');
        rb.className='result-box lose';
        rb.textContent='❌ 沒有連線，再接再厲！';
        playLoseSound();
      },150);
    }

    setTimeout(()=>{isSpinning=false;document.getElementById('spinBtn').disabled=false;document.getElementById('nudgeBtn').classList.remove('disabled');if(autoMode)autoInterval=setInterval(autoSpinCheck,2500)},400);
  }
}

function doNudge(){
  if(isSpinning||nudgeCount>=1)return;
  if(gp()<currentBet*0.5){alert('珍珠幣不足！');return}
  sp(gp()-currentBet*0.5);nudgeCount=1;
  let targetIdx=Math.floor(Math.random()*9);
  let cell=document.getElementById('c'+targetIdx);
  if(cell)cell.classList.add('spinning');
  setTimeout(()=>{
    if(cell)cell.classList.remove('spinning');
  },500);
}

function drawWinLines(wins){
  let svg=document.getElementById('gridSvg');
  if(!svg)return;
  svg.innerHTML='';
  wins.forEach((w,wi)=>{
    setTimeout(()=>{
      let cells=w.line.map(idx=>{let c=document.getElementById('c'+idx);return c?c.getBoundingClientRect():null});
      if(cells.some(c=>!c))return;
      let svgRect=svg.getBoundingClientRect();
      for(let i=0;i<cells.length-1;i++){
        let line=document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1',cells[i].left+cells[i].width/2-svgRect.left);
        line.setAttribute('y1',cells[i].top+cells[i].height/2-svgRect.top);
        line.setAttribute('x2',cells[i+1].left+cells[i+1].width/2-svgRect.left);
        line.setAttribute('y2',cells[i+1].top+cells[i+1].height/2-svgRect.top);
        line.setAttribute('class','wl');
        line.style.animationDelay=(i*0.15)+'s';
        svg.appendChild(line);
      }
      setTimeout(()=>{svg.innerHTML=''},1500);
    },wi*250);
  });
}

function triggerParticles(){
  let container=document.createElement('div');container.className='win-particles';document.body.appendChild(container);
  let colors=['#FFD700','#FF8C00','#FF6600','#FFE44D','#FFA500','#FF69B4'];
  for(let i=0;i<50;i++){
    let p=document.createElement('div');p.className='particle';
    p.style.left=Math.random()*100+'vw';p.style.top=Math.random()*30+'vh';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay=Math.random()*0.5+'s';
    p.style.width=(Math.random()*10+6)+'px';p.style.height=p.style.width;
    container.appendChild(p);
  }
  setTimeout(()=>container.remove(),2000);
}
function triggerMoneyPop(amount){
  let pop=document.createElement('div');pop.className='money-pop';pop.textContent='+$'+amount.toLocaleString();document.body.appendChild(pop);
  setTimeout(()=>pop.remove(),800);
}

function playTick(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=220+Math.random()*80;o.type='square';g.gain.setValueAtTime(.25,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.08);o.start();o.stop(c.currentTime+.09);const o2=c.createOscillator(),g2=c.createGain();o2.connect(g2);g2.connect(c.destination);o2.frequency.value=440+Math.random()*200;o2.type='sawtooth';g2.gain.setValueAtTime(.12,c.currentTime);g2.gain.exponentialRampToValueAtTime(.001,c.currentTime+.05);o2.start();o2.stop(c.currentTime+.06);setTimeout(()=>c.close(),150)}catch(e){}}
function playStopSound(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=280;o.type='square';g.gain.setValueAtTime(.3,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.start();o.stop(c.currentTime+.25);const o2=c.createOscillator(),g2=c.createGain();o2.connect(g2);g2.connect(c.destination);o2.frequency.value=140;o2.type='sawtooth';g2.gain.setValueAtTime(.2,c.currentTime);g2.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25);o2.start();o2.stop(c.currentTime+.3);setTimeout(()=>c.close(),400)}catch(e){}}
function playWinSound(){
  try{
    const c=new(window.AudioContext||window.webkitAudioContext)();
    const now=c.currentTime;

    // ── 煙火爆炸 (0s-3s) ──
    for(let i=0;i<6;i++){
      const t=i*0.45+0.05;
      const freq=150+Math.random()*300;
      const osc=c.createOscillator(),g=c.createGain();
      osc.connect(g);g.connect(c.destination);
      osc.type='sawtooth';osc.frequency.setValueAtTime(freq,c.currentTime+t);
      osc.frequency.exponentialRampToValueAtTime(40,c.currentTime+t+0.15);
      g.gain.setValueAtTime(.4,c.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+0.2);
      osc.start(c.currentTime+t);osc.stop(c.currentTime+t+0.25);
      // 火花粒子
      for(let j=0;j<4;j++){
        const ts=t+Math.random()*0.1;
        const o2=c.createOscillator(),g2=c.createGain();
        o2.connect(g2);g2.connect(c.destination);
        o2.type='square';o2.frequency.value=800+Math.random()*1200;
        g2.gain.setValueAtTime(.15,c.currentTime+ts);
        g2.gain.exponentialRampToValueAtTime(.001,c.currentTime+ts+0.08);
        o2.start(c.currentTime+ts);o2.stop(c.currentTime+ts+0.1);
      }
    }

    // ── 歡呼聲：白噪音爆發 + 上升音 (2s-7s) ──
    for(let r=0;r<5;r++){
      const t=2+r*0.9;
      // 噪音層
      const bufLen=c.sampleRate*0.6;
      const buf=c.createBuffer(1,bufLen,c.sampleRate);
      const data=buf.getChannelData(0);
      for(let i=0;i<bufLen;i++)data[i]=(Math.random()*2-1)*0.3;
      const src=c.createBufferSource();src.buffer=buf;
      const gn=c.createGain();src.connect(gn);gn.connect(c.destination);
      gn.gain.setValueAtTime(.25,c.currentTime+t);
      gn.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+0.6);
      src.start(c.currentTime+t);src.stop(c.currentTime+t+0.65);
      // 歡呼和弦：do-mi-sol-c5 遞進
      const chord=[261.63,329.63,392.00,523.25,659.25,783.99];
      chord.forEach((freq,idx)=>{
        const o=c.createOscillator(),g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.type='triangle';
        o.frequency.setValueAtTime(freq*(1+r*0.06),c.currentTime+t+idx*0.04);
        g.gain.setValueAtTime(.1,c.currentTime+t+idx*0.04);
        g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+idx*0.04+.5);
        o.start(c.currentTime+t+idx*0.04);o.stop(c.currentTime+t+idx*0.04+.55);
      });
    }

    // ── 尖叫聲：高頻 sweep (5s-9s) ──
    for(let i=0;i<4;i++){
      const t=5+i*1.1;
      const o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.type='sine';
      o.frequency.setValueAtTime(1200+i*200,c.currentTime+t);
      o.frequency.linearRampToValueAtTime(2800+i*150,c.currentTime+t+0.4);
      o.frequency.linearRampToValueAtTime(900,c.currentTime+t+0.7);
      g.gain.setValueAtTime(.18,c.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+0.75);
      o.start(c.currentTime+t);o.stop(c.currentTime+t+0.8);
      // 和聲
      const o2=c.createOscillator(),g2=c.createGain();
      o2.connect(g2);g2.connect(c.destination);
      o2.type='triangle';
      o2.frequency.setValueAtTime(1800+i*250,c.currentTime+t+0.05);
      o2.frequency.linearRampToValueAtTime(3500+i*200,c.currentTime+t+0.5);
      g2.gain.setValueAtTime(.1,c.currentTime+t+0.05);
      g2.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+0.55);
      o2.start(c.currentTime+t+0.05);o2.stop(c.currentTime+t+0.6);
    }

    // ── 結尾震撼音 (9s-10.5s) ──
    const endOsc=c.createOscillator(),endG=c.createGain();
    endOsc.connect(endG);endG.connect(c.destination);
    endOsc.type='sawtooth';
    endOsc.frequency.setValueAtTime(80,c.currentTime+9);
    endOsc.frequency.linearRampToValueAtTime(200,c.currentTime+9.8);
    endG.gain.setValueAtTime(.3,c.currentTime+9);
    endG.gain.exponentialRampToValueAtTime(.001,c.currentTime+10.5);
    endOsc.start(c.currentTime+9);endOsc.stop(c.currentTime+10.6);
    // 最後一聲鑔
    const hho=c.createOscillator(),hhg=c.createGain();
    hho.connect(hhg);hhg.connect(c.destination);
    hho.type='square';hho.frequency.value=10000;
    hhg.gain.setValueAtTime(.2,c.currentTime+9.8);
    hhg.gain.exponentialRampToValueAtTime(.001,c.currentTime+10.2);
    hho.start(c.currentTime+9.8);hho.stop(c.currentTime+10.3);

    setTimeout(()=>c.close(),11500);
  }catch(e){}
}
function playLoseSound(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sawtooth';o.frequency.setValueAtTime(200,c.currentTime);o.frequency.linearRampToValueAtTime(90,c.currentTime+.3);g.gain.setValueAtTime(.1,c.currentTime);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.3);o.start();o.stop(c.currentTime+.3);setTimeout(()=>c.close(),400)}catch(e){}}

function openRecharge(){const d=gD();document.getElementById('modalUsd').textContent='$'+((d.total||0)-Number(d.withdrawn||0)).toLocaleString();document.getElementById('modalPearl').textContent=gp().toLocaleString()+' P';document.getElementById('rechargeModal').classList.add('show');updateRechargeOptions()}
function closeRecharge(){document.getElementById('rechargeModal').classList.remove('show')}
function updateRechargeOptions(){const d=gD();const usd=(d.total||0)-Number(d.withdrawn||0);document.querySelectorAll('.r-opt').forEach(el=>{const cost=Number(el.getAttribute('onclick').match(/\d+/)[0]);el.classList.toggle('disabled',usd<cost)})}
function doRecharge(cost){const d=gD();const usd=(d.total||0)-Number(d.withdrawn||0);if(usd<cost){alert('美元不足！');return}sp(gp()+cost*100);d.withdrawn=(d.withdrawn||0)+cost;sD(d);refresh();updateRechargeOptions();document.getElementById('modalUsd').textContent='$'+((d.total||0)-Number(d.withdrawn||0)).toLocaleString();document.getElementById('modalPearl').textContent=gp().toLocaleString()+' P'}
function showJackpot(){document.getElementById('paytableModal').classList.remove('show');document.getElementById('rechargeModal').classList.remove('show');document.getElementById('jpAmount').textContent='$'+jpAmount.toLocaleString()}
function showPaytable(){document.getElementById('paytableModal').classList.add('show')}
function closePaytable(){document.getElementById('paytableModal').classList.remove('show')}
function createStars(){let s=document.getElementById('stars');for(let i=0;i<60;i++){let star=document.createElement('div');star.className='star';star.style.left=Math.random()*100+'%';star.style.top=Math.random()*100+'%';star.style.animationDelay=Math.random()*2+'s';star.style.width=(Math.random()*2+1)+'px';star.style.height=star.style.width;s.appendChild(star)}}
window.onload=function(){
  const d=gD();if(!d.pearls)d.pearls=1000;
  if(!d.total)d.total=0;sD(d);
  maxWin=parseInt(localStorage.getItem('fruit_max')||'0');
  jpAmount=parseInt(localStorage.getItem('fruit_jp')||'0');
  createStars();buildGrid();refresh();
}
